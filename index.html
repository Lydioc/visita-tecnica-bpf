<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visita técnica · BPF Grupo Piracanjuba</title>
<meta name="description" content="Checklist de visita técnica pré-gravação — BPF Grupo Piracanjuba. Funciona offline.">
<meta name="theme-color" content="#F2C14E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visita BPF">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --paper:#F6F5F0; --card:#FFFFFF; --ink:#1C2128; --ink-2:#4B5563; --line:#D9D7CF;
  --tape:#F2C14E; --tape-ink:#1C2128; --blue:#0B5FBF;
  --ok:#1E7B46; --ok-bg:#E3F3E9; --warn:#B8700A; --warn-bg:#FBEFD6; --bad:#B23A2E; --bad-bg:#F8E1DE;
  --radius:10px; --h:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --b:'IBM Plex Sans','Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#15181C; --card:#1E2228; --ink:#EDEBE4; --ink-2:#A9AFB8; --line:#343A43;
  --ok-bg:#163A26; --warn-bg:#3D2C10; --bad-bg:#43201C; --ok:#5BC585; --warn:#E8A33A; --bad:#F08578;
}}
:root[data-theme="dark"]{
  --paper:#15181C; --card:#1E2228; --ink:#EDEBE4; --ink-2:#A9AFB8; --line:#343A43;
  --ok-bg:#163A26; --warn-bg:#3D2C10; --bad-bg:#43201C; --ok:#5BC585; --warn:#E8A33A; --bad:#F08578;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; overscroll-behavior-y:contain}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--b);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
textarea,input{font:inherit;font-size:16px;color:inherit}
img{max-width:100%}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--tape);color:var(--tape-ink);
  padding:10px 14px 0;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.top h1{font:700 26px/1 var(--h);margin:0;letter-spacing:.2px}
.top .sub{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;margin-top:2px;opacity:.85}
.top .sub .r{white-space:nowrap;text-align:right}
#savedtxt.err{font-weight:600;color:var(--bad);background:#fff;border-radius:4px;padding:0 4px}
.prog{height:4px;background:rgba(0,0,0,.18);margin:8px -14px 0;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--tape-ink);width:0;transition:width .3s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:rgba(0,0,0,.08);border-radius:999px;padding:0 14px;min-height:44px;font:600 16px/1 var(--h);white-space:nowrap}
.tabs button.on{background:var(--tape-ink);color:var(--tape)}

/* content */
main{padding:14px 14px 130px;max-width:720px;margin:0 auto}
.sec{display:none}.sec.on{display:block}
.sec>header{margin:4px 0 14px}
.sec>header h2{font:700 30px/1 var(--h);margin:0}
.sec>header p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.ref{border-left:4px solid var(--tape);padding:8px 12px;margin:0 0 14px;background:var(--card);border-radius:0 var(--radius) var(--radius) 0;font-size:14px;color:var(--ink-2)}
.ref b{color:var(--ink)}
.tip{display:flex;align-items:flex-start;gap:8px}
.tip span{flex:1;padding-top:10px}
.tip button{flex:0 0 44px;width:44px;height:44px;border:0;background:transparent;font-size:24px;line-height:1;color:var(--ink-2)}
.grp{margin:0 0 22px}
.grp h3{font:600 20px/1.1 var(--h);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.grp h3 small{font:500 13px var(--b);color:var(--ink-2)}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.item.done{border-color:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.item .lab{font-weight:500;margin:0 0 8px}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;min-height:44px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:9px 4px;font:600 16px/1 var(--h)}
.seg button.ok.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button.warn.on{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.seg button.bad.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.field{position:relative}
.field textarea{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:9px 52px 9px 10px;background:var(--paper);outline:none}
.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(11,95,191,.2)}
.field .mic{position:absolute;right:4px;top:4px;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center}
.field .mic.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.field .mic[hidden]{display:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(178,58,46,.25)}}
@media (prefers-reduced-motion:reduce){.field .mic.rec{animation:none}.prog i{transition:none}}
.partial{font-size:13px;color:var(--ink-2);font-style:italic;min-height:0;padding:2px 2px 0}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.photos .ph{position:relative;width:80px;height:80px;border-radius:6px;overflow:hidden;background:var(--line)}
.photos .ph .thumb{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph .del{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:1;padding:0}
.photos .ph .del::after{content:"";position:absolute;inset:-9px}
.photos label{width:80px;height:80px;border:1.5px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--ink-2);font-size:12px;text-align:center;line-height:1.15;cursor:pointer}
.photos label input{display:none}
.vis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vis label{display:block;font-size:13px;color:var(--ink-2)}
.vis label.w{grid-column:1/-1}
.vis input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--card);margin-top:3px}
.vis input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(11,95,191,.2)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;max-width:100%}
.bar button{flex:1;min-height:48px;border-radius:10px;padding:13px 10px;font:700 18px/1 var(--h);border:1px solid var(--line);background:transparent}
.bar button:disabled{opacity:.4}
.bar button.main{background:var(--ink);color:var(--paper);border-color:var(--ink);flex:2}
.bar .nav{flex:0 0 52px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:9px 14px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90%;text-align:center}
.toast.on{opacity:1}

/* aviso de nova versão */
#upd{position:fixed;left:10px;right:10px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px;
  max-width:700px;margin:0 auto;background:var(--ink);color:var(--paper);border-radius:12px;padding:6px 6px 6px 14px;font-size:15px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#upd span{flex:1}
#upd button{min-height:44px;padding:0 16px;border:0;border-radius:8px;background:var(--tape);color:var(--tape-ink);font:700 17px/1 var(--h)}

/* foto em tela cheia */
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb button{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:30px;line-height:1;padding:0}

/* report view */
#report{display:none}
#report.on{display:block}
.rep-actions{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.rep-actions button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 14px;min-height:44px;font:600 17px/1 var(--h)}
.rep-actions button.prim{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rep-actions .lbl{flex:0 0 100%;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.6px;margin-top:6px}
.rep{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px}
.rep h2{font:700 28px/1 var(--h);margin:0}
.rep .meta{font-size:14px;color:var(--ink-2);margin:4px 0 14px}
.rep h3{font:700 22px/1 var(--h);margin:22px 0 8px;padding-top:10px;border-top:2px solid var(--line)}
.rep h4{font:600 17px/1.1 var(--h);margin:14px 0 6px;color:var(--ink-2)}
.rep .ri{padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rep .ri .l{font-weight:500}
.rep .ri .t{white-space:pre-wrap;margin-top:2px}
.rep .ri .empty{color:var(--ink-2);font-style:italic}
.badge{display:inline-block;font:600 12px/1 var(--h);padding:3px 7px;border-radius:4px;margin-left:6px;vertical-align:middle}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}
.rep .rph{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rep .rph img{width:120px;height:120px;object-fit:cover;border-radius:6px}
.sum{background:var(--paper);border-radius:8px;padding:10px 12px;font-size:14px}
.sum ul{margin:6px 0 0;padding-left:18px}
.sum li{margin:2px 0}
@media print{
  .top,.bar,.rep-actions,.toast,#upd,#lb,#tip{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .rep{border:0;padding:0}
  .rep .rph img{width:150px;height:150px}
  .rep .ri{break-inside:avoid}
}
</style>
</head>
<body>

<div class="top">
  <h1>Visita técnica · BPF Grupo Piracanjuba</h1>
  <div class="sub"><span id="subline">Roteiro pré-gravação</span><span class="r"><span id="savedtxt" role="status"></span> · <span id="progtxt">0 / 0</span></span></div>
  <div class="prog"><i id="progbar"></i></div>
  <div class="tabs" id="tabs"></div>
</div>

<main>
  <div class="ref tip" id="tip" hidden><span><b>Ditado por voz:</b> este navegador não oferece ditado dentro do app. Toque no campo e use o <b>microfone do teclado</b> do celular.</span><button id="tipX" aria-label="Fechar dica">×</button></div>
  <div id="form"></div>
  <div id="report">
    <div class="rep-actions">
      <button id="btnBack">← Voltar ao checklist</button>
      <span class="lbl">Relatório</span>
      <button id="btnShare" class="prim">Compartilhar</button>
      <button id="btnPrint">Imprimir / PDF</button>
      <button id="btnSave">Baixar HTML</button>
      <span class="lbl">Dados deste aparelho</span>
      <button id="btnBackup">Backup (JSON)</button>
      <button id="btnRestore">Restaurar backup</button>
      <button id="btnReset">Limpar tudo</button>
      <input type="file" id="fileRestore" accept=".json,application/json" hidden>
    </div>
    <div class="rep" id="repBody"></div>
  </div>
</main>

<div class="bar" id="bar">
  <button class="nav" id="btnPrev" aria-label="Seção anterior">‹</button>
  <button class="main" id="btnReport">Gerar relatório</button>
  <button class="nav" id="btnNext" aria-label="Próxima seção">›</button>
</div>

<div id="upd" role="alert" hidden><span>Nova versão disponível — recarregar</span><button id="updBtn">Recarregar</button></div>
<div id="lb" role="dialog" aria-label="Foto em tela cheia" hidden><img id="lbimg" alt=""><button id="lbx" aria-label="Fechar foto">×</button></div>
<div class="toast" id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
